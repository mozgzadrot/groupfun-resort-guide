  <script>
    // Self-destruct any leftover service workers and clear CacheStorage —
    // dev iteration was getting blocked by something serving stale assets.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    }
    if (window.caches) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }
    console.log('[GroupFun] build=20260521e · single-button morph');
  </script>
